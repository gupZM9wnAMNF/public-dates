<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Evento</title>
    <meta property="og:title" id="ogTitle" content="Evento">
    <meta property="og:description" id="ogDescription" content="">
    <meta property="og:image" id="ogImage" content="">
    <meta property="og:url" id="ogUrl" content="">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            padding: 30px 20px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .event-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .details {
            padding: 20px;
        }

        .detail-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            display: block;
        }

        .detail-value {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .detail-value a {
            color: #667eea;
            text-decoration: none;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }

        #guests-section {
            display: none;
        }

        .guests-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .guest-tag {
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #555;
        }

        .actions {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: #f9f9f9;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #25d366;
            color: white;
        }

        .btn-secondary:hover {
            background: #1fb654;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }

        .back-link {
            display: inline-block;
            padding: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="eventTitle">Evento</h1>
            <p id="eventSubtitle"></p>
        </div>
        <img id="eventImage" class="event-image" src="" alt="Evento">
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">📅 Data</span>
                <span class="detail-value" id="eventDate"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label">⏰ Orario</span>
                <span class="detail-value" id="eventTime"></span>
            </div>
            <div class="detail-item">
                <span class="detail-label">📍 Luogo</span>
                <span class="detail-value"><a id="locationLink" href="">Luogo</a></span>
            </div>
            <div class="detail-item" id="guests-section">
                <span class="detail-label">👥 Ospiti</span>
                <div class="guests-list" id="guestsList"></div>
            </div>
            <div class="detail-item">
                <span class="detail-label">📝 Descrizione</span>
                <span class="detail-value" id="eventDescription"></span>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="downloadCalendar()">Scarica Calendario</button>
            <button class="btn btn-secondary" onclick="shareWhatsApp()">Condividi WhatsApp</button>
        </div>
    </div>
    <a href="../" class="back-link">← Indietro</a>

    <script>
        const eventConfig = {
            title: "Generale, questa non è la sua collina",
            subtitle: "Quindi, per favore, resti dietro la collina",
            date: "2026-09-20",
            startTime: "10:00",
            endTime: "13:00",
            location: "Piazza Gualterio, Orvieto",
            locationCoordinates: { lat: 42.718084, lng:12.111327 }, // per geo URI
            description: "Picchetto orvietano democratico e antifascista con microfono aperto",
            image: "https://gupZM9wnAMNF.github.io/public-dates/20260920_antiv/img_antiv_20260920.jpg",
            guests: [],
            eventId: "20260920_antiv"
        };

        async function geocodeLocation(locationName) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locationName)}&format=json&limit=1`
                );
                const data = await response.json();
                
                if (data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lng: parseFloat(data[0].lon)
                    };
                }
            } catch (error) {
                console.error('Geocoding error:', error);
            }
            return null;
        }

        async function populateUI() {
            // Se manca locationCoordinates, geocodifica automaticamente
            if (eventConfig.location && !eventConfig.locationCoordinates) {
                const coords = await geocodeLocation(eventConfig.location);
                if (coords) {
                    eventConfig.locationCoordinates = coords;
                }
            }

            document.getElementById('pageTitle').textContent = eventConfig.title;
            document.getElementById('eventTitle').textContent = eventConfig.title;
            document.getElementById('eventSubtitle').textContent = eventConfig.subtitle;
            document.getElementById('eventDate').textContent = eventConfig.date;
            document.getElementById('eventTime').textContent = `${eventConfig.startTime} - ${eventConfig.endTime}`;
            document.getElementById('eventImage').src = eventConfig.image;
            document.getElementById('eventDescription').textContent = eventConfig.description;

            const locationLink = document.getElementById('locationLink');
            locationLink.textContent = eventConfig.location;
            locationLink.href = eventConfig.locationCoordinates
                ? `geo:${eventConfig.locationCoordinates.lat},${eventConfig.locationCoordinates.lng}`
                : `geo:0,0?q=${encodeURIComponent(eventConfig.location)}`;

            if (eventConfig.guests && eventConfig.guests.length > 0) {
                document.getElementById('guests-section').style.display = 'block';
                const guestsList = document.getElementById('guestsList');
                guestsList.innerHTML = eventConfig.guests.map(guest => `<span class="guest-tag">${guest}</span>`).join('');
            }

            document.getElementById('ogTitle').content = eventConfig.title;
            document.getElementById('ogDescription').content = eventConfig.description;
            document.getElementById('ogImage').content = eventConfig.image;
            document.getElementById('ogUrl').content = window.location.href;
        }

        function downloadCalendar() {
            const now = new Date();
            const timestamp = now.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Event Calendar//EN
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
UID:${eventConfig.eventId}
DTSTAMP:${timestamp}
DTSTART:${eventConfig.date.replace(/\s/g, '')}T${eventConfig.startTime.replace(':', '')}00
DTEND:${eventConfig.date.replace(/\s/g, '')}T${eventConfig.endTime.replace(':', '')}00
SUMMARY:${eventConfig.title}
DESCRIPTION:${eventConfig.description}
LOCATION:${eventConfig.location}
${eventConfig.locationCoordinates ? `GEO:${eventConfig.locationCoordinates.lat};${eventConfig.locationCoordinates.lng}` : ''}
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${eventConfig.title.replace(/\s/g, '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function shareWhatsApp() {
            const message = `📅 ${eventConfig.title}\n⏰ ${eventConfig.date} ${eventConfig.startTime} - ${eventConfig.endTime}\n📍 ${eventConfig.location}\n\n${eventConfig.description}\n\n${window.location.href}`;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        populateUI();
    </script>
</body>
</html>
