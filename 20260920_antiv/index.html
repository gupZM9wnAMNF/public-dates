    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            padding: 30px 20px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
color: white;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 16px; opacity: 0.95; }
        .event-image { width: 100%; height: auto; display: block; }
        .details { padding: 20px; }
        .detail-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }
        .detail-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .detail-label { font-weight: 600; color: #333; margin-bottom: 6px; display: block; }
        .detail-value { color: #666; font-size: 15px; line-height: 1.5; }
        .detail-value a { color: #667eea; text-decoration: none; }
        .detail-value a:hover { text-decoration: underline; }
        .guests-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .guest-tag { background: #f0f0f0; padding: 6px 12px; border-radius: 20px; font-size: 14px; color: #555; }
        .actions { display: flex; gap: 12px; padding: 20px; background: #f9f9f9; }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #25d366; color: white; }
        .btn-secondary:hover { background: #1fb654; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Generale, questa non è la sua trincea</h1>
            <p>Quindi, per favore, resti dietro la collina</p>
        </div>
        <img class="event-image" src="https://gupZM9wnAMNF.github.io/public-dates/20260920_antiv/img_antiv_20260920.jpg" alt="Generale, questa non è la sua trincea">
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">📅 Data</span>
                <span class="detail-value">domenica 20 settembre 2026</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">⏰ Orario</span>
                <span class="detail-value">10:00 - 13:00</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">📍 Luogo</span>
                <span class="detail-value"><a href="https://www.google.com/maps/search/?api=1&amp;query=42.718162,12.111515" target="_blank" rel="noopener">Via dei Gualtieri, 1, Orvieto</a></span>
            </div>
            
            <div class="detail-item">
                <span class="detail-label">📝 Descrizione</span>
                <span class="detail-value">Picchetto orvietano democratico e antifascista con microfono aperto</span>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="downloadCalendar()">Scarica Calendario</button>
            <button class="btn btn-secondary" onclick="shareWhatsApp()">Condividi WhatsApp</button>
        </div>
    </div>

    <script>
        const eventConfig = {"eventId": "20260920_antiv", "title": "Generale, questa non è la sua trincea", "subtitle": "Quindi, per favore, resti dietro la collina", "date": "2026-09-20", "startTime": "10:00", "endTime": "13:00", "location": "Via dei Gualtieri, 1, Orvieto", "locationCoordinates": {"lat": 42.718162, "lng": 12.111515}, "description": "Picchetto orvietano democratico e antifascista con microfono aperto", "image": "https://gupZM9wnAMNF.github.io/public-dates/20260920_antiv/img_antiv_20260920.jpg", "guests": [], "dateHuman": "domenica 20 settembre 2026", "pageUrl": "https://gupZM9wnAMNF.github.io/public-dates/20260920_antiv/"};

        function downloadCalendar() {
            const esc = s => s.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
            const d = eventConfig.date.replace(/-/g, '');
            const t = s => s.replace(':', '') + '00';
            const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const c = eventConfig.locationCoordinates;

            const lines = [
                'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Event Calendar//EN',
                'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
                `UID:${eventConfig.eventId}@github.io`,
                `DTSTAMP:${stamp}`,
                `DTSTART:${d}T${t(eventConfig.startTime)}`,
                `DTEND:${d}T${t(eventConfig.endTime)}`,
                `SUMMARY:${esc(eventConfig.title)}`,
                `DESCRIPTION:${esc(eventConfig.description)}`,
                `LOCATION:${esc(eventConfig.location)}`,
                ...(c ? [`GEO:${c.lat};${c.lng}`] : []),
                'END:VEVENT', 'END:VCALENDAR'
            ];

            const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${eventConfig.eventId}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function shareWhatsApp() {
            const message = `\u{1F4C5} ${eventConfig.title}\n\u23F0 ${eventConfig.dateHuman}, ${eventConfig.startTime} - ${eventConfig.endTime}\n\u{1F4CD} ${eventConfig.location}\n\n${eventConfig.description}\n\n${eventConfig.pageUrl}`;
            if (navigator.share) {
                navigator.share({ text: message }).catch(() => {});
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
            }
        }
    </script>
</body>
