<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Evento</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" id="ogTitle" content="Evento">
    <meta property="og:description" id="ogDescription" content="Unisciti a noi!">
    <meta property="og:image" id="ogImage" content="">
    <meta property="og:url" id="ogUrl" content="">
    <meta property="og:type" content="event">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .back-link {
            display: inline-block;
            padding: 15px 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            background: #f5f5f5;
        }

        .header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .event-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            display: block;
        }

        .details {
            padding: 30px 20px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-icon {
            font-size: 24px;
            margin-right: 15px;
            min-width: 30px;
        }

        .detail-content {
            flex: 1;
        }

        .detail-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        .detail-value a {
            color: #667eea;
            text-decoration: none;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }

        #guests-section {
            display: none;
        }

        .guests-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .guest-tag {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #333;
        }

        .actions {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #f9f9f9;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">← Indietro</a>

        <div class="header">
            <h1 id="eventTitle">Evento</h1>
            <p id="eventSubtitle">Ti aspettiamo!</p>
        </div>

        <img id="eventImage" src="" alt="Evento" class="event-image">

        <div class="details">
            <!-- Data -->
            <div class="detail-item">
                <div class="detail-icon">📅</div>
                <div class="detail-content">
                    <div class="detail-label">Data</div>
                    <div class="detail-value" id="eventDate">—</div>
                </div>
            </div>

            <!-- Orario -->
            <div class="detail-item">
                <div class="detail-icon">⏰</div>
                <div class="detail-content">
                    <div class="detail-label">Orario</div>
                    <div class="detail-value" id="eventTime">—</div>
                </div>
            </div>

            <!-- Luogo -->
            <div class="detail-item">
                <div class="detail-icon">📍</div>
                <div class="detail-content">
                    <div class="detail-label">Luogo</div>
                    <div class="detail-value">
                        <a id="eventLocation" href="geo:" target="_blank">—</a>
                    </div>
                </div>
            </div>

            <!-- Ospiti (condizionale) -->
            <div class="detail-item" id="guests-section">
                <div class="detail-icon">👥</div>
                <div class="detail-content">
                    <div class="detail-label">Ospiti</div>
                    <div class="guests-list" id="guestsList"></div>
                </div>
            </div>

            <!-- Descrizione -->
            <div class="detail-item">
                <div class="detail-icon">📝</div>
                <div class="detail-content">
                    <div class="detail-label">Descrizione</div>
                    <div class="detail-value" id="eventDescription">—</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="downloadCalendar()">📥 Scarica in Calendario</button>
            <button class="btn btn-secondary" onclick="shareWhatsApp()">💬 Condividi su WhatsApp</button>
        </div>
    </div>

    <script>
        // === CONFIGURAZIONE EVENTO ===
        const eventConfig = {
            title: "Generale, questa non è la sua collina",
            subtitle: "Quindi, per favore, resti dietro la collina",
            date: "2026-09-20",
            startTime: "10:00",
            endTime: "13:00",
            location: "Piazza Gualterio, Orvieto",
            locationCoordinates: { lat: 42.718084, lng:12.111327 }, // per geo URI
            description: "Picchetto orvietano democratico e antifascista con microfono aperto",
            image: "https://gupZM9wnAMNF.github.io/public-dates/20260920_antiv/img_antiv_20260920.jpg",
            guests: [],
            eventId: "20260920_antiv"
        };

        // === INIZIALIZZAZIONE ===
        document.addEventListener('DOMContentLoaded', () => {
            populateUI();
        });

        // === POPOLA L'INTERFACCIA ===
        function populateUI() {
            // Titolo pagina e meta tag
            document.getElementById('pageTitle').textContent = eventConfig.title;
            document.getElementById('ogTitle').setAttribute('content', eventConfig.title);
            document.getElementById('ogDescription').setAttribute('content', eventConfig.description);
            document.getElementById('ogImage').setAttribute('content', eventConfig.image);
            document.getElementById('ogUrl').setAttribute('content', window.location.href);

            // Header
            document.getElementById('eventTitle').textContent = eventConfig.title;
            document.getElementById('eventSubtitle').textContent = eventConfig.subtitle;

            // Immagine
            document.getElementById('eventImage').src = eventConfig.image;
            document.getElementById('eventImage').alt = eventConfig.title;

            // Data
            const dateObj = new Date(eventConfig.date);
            const formattedDate = dateObj.toLocaleDateString('it-IT', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('eventDate').textContent = formattedDate;

            // Orario (startTime - endTime)
            const timeRange = `${eventConfig.startTime} - ${eventConfig.endTime}`;
            document.getElementById('eventTime').textContent = timeRange;

            // Luogo con coordinate
            const locationLink = document.getElementById('eventLocation');
            locationLink.textContent = eventConfig.location;
            if (eventConfig.locationCoordinates && eventConfig.locationCoordinates.lat && eventConfig.locationCoordinates.lng) {
                locationLink.href = `geo:${eventConfig.locationCoordinates.lat},${eventConfig.locationCoordinates.lng}?q=${encodeURIComponent(eventConfig.location)}`;
            } else {
                locationLink.href = `geo:0,0?q=${encodeURIComponent(eventConfig.location)}`;
            }

            // Ospiti (mostra solo se presenti)
            if (eventConfig.guests && eventConfig.guests.length > 0) {
                document.getElementById('guests-section').style.display = 'flex';
                const guestsList = document.getElementById('guestsList');
                guestsList.innerHTML = '';
                eventConfig.guests.forEach(guest => {
                    const tag = document.createElement('div');
                    tag.className = 'guest-tag';
                    tag.textContent = guest;
                    guestsList.appendChild(tag);
                });
            } else {
                document.getElementById('guests-section').style.display = 'none';
            }

            // Descrizione
            document.getElementById('eventDescription').textContent = eventConfig.description;
        }

        // === SCARICA CALENDARIO ===
        function downloadCalendar() {
            const startDateTime = `${eventConfig.date.replace(/-/g, '')}T${eventConfig.startTime.replace(':', '')}00`;
            const endDateTime = `${eventConfig.date.replace(/-/g, '')}T${eventConfig.endTime.replace(':', '')}00`;
            
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//WhatsApp Event//EN
CALSCALE:GREGORIAN
METHOD:PUBLISH
X-WR-CALNAME:${eventConfig.title}
X-WR-TIMEZONE:Europe/Rome
BEGIN:VEVENT
UID:${eventConfig.eventId}@github.io
DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z
DTSTART:${startDateTime}
DTEND:${endDateTime}
SUMMARY:${eventConfig.title}
DESCRIPTION:${eventConfig.description}
LOCATION:${eventConfig.location}
GEO:${eventConfig.locationCoordinates ? eventConfig.locationCoordinates.lat + ';' + eventConfig.locationCoordinates.lng : '0;0'}
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${eventConfig.eventId}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // === CONDIVIDI SU WHATSAPP ===
        function shareWhatsApp() {
            const text = `Ciao! 👋\n\n🎉 ${eventConfig.title}\n📅 ${document.getElementById('eventDate').textContent}\n⏰ ${document.getElementById('eventTime').textContent}\n📍 ${eventConfig.location}\n\n${eventConfig.description}\n\n🔗 ${window.location.href}`;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
